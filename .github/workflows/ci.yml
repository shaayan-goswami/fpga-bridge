name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  windows-script-syntax:
    name: Check windows/setup.ps1 parses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse script
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'windows/setup.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host 'windows/setup.ps1 parses cleanly'

  # The Swift tests use stub ssh/scp, so they can't tell whether Windows' cmd.exe reads our command lines the way we
  # think (for example, text after `&` on an `if` line belongs to that `if`). This job runs the exact command lines
  # through a real cmd.exe. Keep them identical to Remote.swift: CIWorkflowTests fails if they drift.
  windows-cmd-lines:
    name: Run remote command lines through real cmd.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock, prep and unlock
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'fake-profile'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir

          # Runs one line the way sshd does (through cmd.exe). A batch file avoids PowerShell's argument quoting.
          function Invoke-Cmd([string]$line) {
            Set-Content -Path "$dir\line.cmd" -Value @('@echo off', $line) -Encoding ascii
            & cmd.exe /c "$dir\line.cmd" 2>&1 | Out-String | Write-Host
            return $LASTEXITCODE
          }

          $acquire = @'
          (if not exist .fpga-bridge mkdir .fpga-bridge) & mkdir .fpga-bridge\lock && echo ci@runner building demo since 2026-10-15T10:00:00Z> .fpga-bridge\lock\owner.txt
          '@
          $acquireOther = @'
          (if not exist .fpga-bridge mkdir .fpga-bridge) & mkdir .fpga-bridge\lock && echo other@runner building demo since 2026-10-15T11:00:00Z> .fpga-bridge\lock\owner.txt
          '@
          $readOwner = @'
          type .fpga-bridge\lock\owner.txt
          '@
          $prep = @'
          (if not exist .fpga-bridge mkdir .fpga-bridge) & (if exist .fpga-bridge\demo rmdir /s /q .fpga-bridge\demo)
          '@
          $release = @'
          rmdir /s /q .fpga-bridge\lock
          '@
          $unlock = @'
          (if exist .fpga-bridge\lock rmdir /s /q .fpga-bridge\lock)
          '@
          $readManifest = @'
          type .fpga-bridge\demo.runs\synth_1\manifest.json
          '@

          # The first acquire works from a clean profile and records the owner.
          if ((Invoke-Cmd $acquire) -ne 0) { throw 'first acquire failed' }
          $owner = (Get-Content .fpga-bridge\lock\owner.txt -Raw).Trim()
          if ($owner -ne 'ci@runner building demo since 2026-10-15T10:00:00Z') { throw "wrong owner file: [$owner]" }

          # A second acquire must fail and must not overwrite the first owner.
          if ((Invoke-Cmd $acquireOther) -eq 0) { throw 'second acquire should have failed while the lock is held' }
          $owner = (Get-Content .fpga-bridge\lock\owner.txt -Raw).Trim()
          if ($owner -ne 'ci@runner building demo since 2026-10-15T10:00:00Z') { throw "owner was overwritten: [$owner]" }
          if ((Invoke-Cmd $readOwner) -ne 0) { throw 'reading the owner failed' }

          # Prep must clear a stale job directory even when .fpga-bridge already exists (the `&`-after-`if` trap).
          New-Item -ItemType Directory -Force .fpga-bridge\demo | Out-Null
          Set-Content .fpga-bridge\demo\old.txt 'stale'
          if ((Invoke-Cmd $prep) -ne 0) { throw 'prep failed' }
          if (Test-Path .fpga-bridge\demo) { throw 'stale job directory survived prep' }
          if ((Invoke-Cmd $prep) -ne 0) { throw 'prep with nothing to remove should succeed' }

          # Prep creates the scratch directory when it is missing.
          Remove-Item .fpga-bridge -Recurse -Force
          if ((Invoke-Cmd $prep) -ne 0) { throw 'prep on a fresh profile failed' }
          if (-not (Test-Path .fpga-bridge)) { throw 'prep did not create .fpga-bridge' }

          # Release, then the lock can be taken again.
          if ((Invoke-Cmd $acquire) -ne 0) { throw 'acquire after prep failed' }
          if ((Invoke-Cmd $release) -ne 0) { throw 'release failed' }
          if (Test-Path .fpga-bridge\lock) { throw 'lock survived release' }
          if ((Invoke-Cmd $acquire) -ne 0) { throw 'acquire after release failed' }

          # Unlock removes a held lock, and succeeds when there is none.
          if ((Invoke-Cmd $unlock) -ne 0) { throw 'unlock failed' }
          if (Test-Path .fpga-bridge\lock) { throw 'lock survived unlock' }
          if ((Invoke-Cmd $unlock) -ne 0) { throw 'unlock with no lock should succeed' }

          # Reading a checkpoint's manifest fails when there is none, and prints it when there is.
          if ((Invoke-Cmd $readManifest) -eq 0) { throw 'reading a missing manifest should fail' }
          New-Item -ItemType Directory -Force .fpga-bridge\demo.runs\synth_1 | Out-Null
          Set-Content .fpga-bridge\demo.runs\synth_1\manifest.json '{"project":"demo"}'
          Set-Content -Path "$dir\line.cmd" -Value @('@echo off', $readManifest) -Encoding ascii
          $printed = (& cmd.exe /c "$dir\line.cmd" | Out-String).Trim()
          if ($printed -ne '{"project":"demo"}') { throw "manifest read back wrong: [$printed]" }
          Write-Host 'cmd.exe command lines behave as expected'

      - name: Cancel kills the marked process tree and nothing else
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cancel-test'
          New-Item -ItemType Directory -Force $dir | Out-Null

          $cancel = @'
          powershell -NoProfile -NonInteractive -Command "Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like ('*fpgabridge-' + 'a1b2c3d4*') -and $_.ProcessId -ne $PID } | ForEach-Object { taskkill /F /T /PID $_.ProcessId }"
          '@

          # Stand-ins for vivado.bat (carries the marker on its command line) and an unrelated process.
          $marked = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'ping -n 120 127.0.0.1 >nul & rem fpgabridge-a1b2c3d4' -PassThru
          $other  = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'ping -n 120 127.0.0.1 >nul & rem unrelated' -PassThru
          Start-Sleep -Seconds 3
          if (-not (Get-Process -Id $marked.Id -ErrorAction SilentlyContinue)) { throw 'marked stand-in did not start' }

          Set-Content -Path "$dir\cancel.cmd" -Value @('@echo off', $cancel) -Encoding ascii
          & cmd.exe /c "$dir\cancel.cmd" 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "cancel command exited with $LASTEXITCODE" }
          Start-Sleep -Seconds 3

          if (Get-Process -Id $marked.Id -ErrorAction SilentlyContinue) { throw 'marked process survived the cancel command' }
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*fpgabridge-a1b2c3d4*' }
          if ($left) { throw 'a process with the marker is still running' }
          if (-not (Get-Process -Id $other.Id -ErrorAction SilentlyContinue)) { throw 'the cancel command killed an unrelated process' }
          Stop-Process -Id $other.Id -Force
          Write-Host 'cancel command stops only the marked job'

  # Manual only: runs the real setup script on a Windows runner (installs and starts OpenSSH, changes the
  # firewall). The runner is thrown away afterwards. Tailscale is not installed there, so the script is
  # expected to warn about it; a fake Vivado install is created so discovery can be checked.
  windows-setup-smoke:
    name: Run windows/setup.ps1 (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a fake Vivado install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'C:\Xilinx\Vivado\2022.2\bin', 'C:\Xilinx\Vivado\2023.2\bin' | Out-Null
          Set-Content 'C:\Xilinx\Vivado\2022.2\bin\vivado.bat' '@echo off'
          Set-Content 'C:\Xilinx\Vivado\2023.2\bin\vivado.bat' '@echo off'
      - name: Run setup.ps1 with a throwaway key
        shell: pwsh
        run: |
          $key = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFakeKeyForCiSmokeTestOnlyDoNotUse0000000 ci@example'
          .\windows\setup.ps1 -PublicKey $key *>&1 | Tee-Object -FilePath setup-output.txt
      - name: Check results
        shell: pwsh
        run: |
          $out = Get-Content setup-output.txt -Raw
          if ((Get-Service sshd).Status -ne 'Running') { throw 'sshd is not running' }
          if ((Get-Service sshd).StartType -ne 'Automatic') { throw 'sshd is not set to start automatically' }
          if ($out -notmatch [regex]::Escape('C:\Xilinx\Vivado\2023.2\bin\vivado.bat')) { throw 'newest Vivado was not chosen' }
          $keys = Get-Content "$env:ProgramData\ssh\administrators_authorized_keys" -ErrorAction SilentlyContinue
          if (-not ($keys -match 'ci@example')) { throw 'public key was not authorized' }
          Write-Host 'setup.ps1 smoke test passed'

  # The Swift tests run the Linux command lines with macOS's bash and BSD tools. This job runs the exact same lines on
  # a real Linux runner (GNU bash 5, GNU coreutils), the way sshd would (`$SHELL -c '<line>'`), and runs
  # linux/setup.sh. Keep the lines identical to RemoteCommands.swift: CIWorkflowTests fails if they drift.
  linux-cmd-lines:
    name: Run remote command lines and setup.sh on real Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock, prep, unlock, Vivado check and cancel
        run: |
          set -eu
          home="$RUNNER_TEMP/fake-home"
          mkdir -p "$home" /tmp/fpga-bridge-ci
          cd "$home"

          read -r -d '' ACQUIRE <<'EOF' || true
          bash -lc 'mkdir -p .fpga-bridge && mkdir .fpga-bridge/lock && echo '\''ci@runner building demo since 2026-10-15T10:00:00Z'\'' > .fpga-bridge/lock/owner.txt'
          EOF
          read -r -d '' ACQUIRE_OTHER <<'EOF' || true
          bash -lc 'mkdir -p .fpga-bridge && mkdir .fpga-bridge/lock && echo '\''other@runner building demo since 2026-10-15T11:00:00Z'\'' > .fpga-bridge/lock/owner.txt'
          EOF
          read -r -d '' READ_OWNER <<'EOF' || true
          bash -lc 'cat .fpga-bridge/lock/owner.txt'
          EOF
          read -r -d '' PREP <<'EOF' || true
          bash -lc 'mkdir -p .fpga-bridge && rm -rf .fpga-bridge/demo'
          EOF
          read -r -d '' RELEASE <<'EOF' || true
          bash -lc 'rm -rf .fpga-bridge/lock'
          EOF
          read -r -d '' UNLOCK <<'EOF' || true
          bash -lc 'rm -rf .fpga-bridge/lock'
          EOF
          read -r -d '' EXISTS <<'EOF' || true
          bash -lc '[ -x '\''/tmp/fpga-bridge-ci/vivado'\'' ] && echo found || echo missing'
          EOF
          read -r -d '' BUILD <<'EOF' || true
          bash -lc 'cd .fpga-bridge/demo && '\''/tmp/fpga-bridge-ci/vivado'\'' -mode batch -nojournal -nolog -source build.tcl -tclargs fpgabridge-a1b2c3d4'
          EOF
          read -r -d '' READ_MANIFEST <<'EOF' || true
          bash -lc 'cat .fpga-bridge/demo.runs/synth_1/manifest.json'
          EOF
          read -r -d '' CANCEL <<'EOF' || true
          bash -lc 'pkill -9 -f '\''[f]pgabridge-a1b2c3d4'\'''
          EOF

          # Runs a line the way sshd does: through the login shell with -c.
          remote() { bash -c "$1"; }

          # The lock is taken once, can be read, and is free again after release.
          remote "$ACQUIRE"
          if remote "$ACQUIRE_OTHER" 2>/dev/null; then echo "a second build took the lock"; exit 1; fi
          [ "$(remote "$READ_OWNER")" = "ci@runner building demo since 2026-10-15T10:00:00Z" ]
          remote "$RELEASE"
          [ ! -e .fpga-bridge/lock ]
          remote "$ACQUIRE"
          remote "$UNLOCK"
          [ ! -e .fpga-bridge/lock ]
          remote "$UNLOCK"

          # Prep clears a stale job directory.
          mkdir -p .fpga-bridge/demo/out
          remote "$PREP"
          [ ! -e .fpga-bridge/demo ]

          # A checkpoint's manifest is printed, and reading one that isn't there fails.
          if remote "$READ_MANIFEST" 2>/dev/null; then echo "a missing manifest was read"; exit 1; fi
          mkdir -p .fpga-bridge/demo.runs/synth_1
          echo '{"project":"demo"}' > .fpga-bridge/demo.runs/synth_1/manifest.json
          [ "$(remote "$READ_MANIFEST")" = '{"project":"demo"}' ]

          # A Vivado launcher is found only when it is executable.
          [ "$(remote "$EXISTS")" = "missing" ]
          printf '#!/bin/sh\npwd > args.txt\necho "$@" >> args.txt\n' > /tmp/fpga-bridge-ci/vivado
          [ "$(remote "$EXISTS")" = "missing" ]
          chmod +x /tmp/fpga-bridge-ci/vivado
          [ "$(remote "$EXISTS")" = "found" ]

          # The build line runs the launcher inside the job directory, with the job's marker.
          mkdir -p .fpga-bridge/demo
          remote "$BUILD"
          grep -q 'fpgabridge-a1b2c3d4' .fpga-bridge/demo/args.txt
          grep -q '.fpga-bridge/demo' .fpga-bridge/demo/args.txt

          # Cancel kills the job with the marker and leaves another job alone.
          bash -c "exec -a 'fake-vivado -tclargs fpgabridge-a1b2c3d4' sleep 120" &
          marked=$!
          bash -c "exec -a 'fake-vivado -tclargs fpgabridge-deadbeef' sleep 120" &
          other=$!
          sleep 1
          remote "$CANCEL"
          sleep 1
          if kill -0 "$marked" 2>/dev/null; then echo "the marked job survived"; exit 1; fi
          kill -0 "$other"
          kill "$other"
          echo "all Linux command lines behaved"
      - name: linux/setup.sh finds Vivado in both install layouts and prints the init command
        run: |
          set -eu
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools/Vivado/2023.2/bin" "$tools/2025.2/Vivado/bin" "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "vivado v2023.2"\n' > "$tools/Vivado/2023.2/bin/vivado"
          printf '#!/bin/sh\necho "vivado v2025.2 (64-bit)"\n' > "$tools/2025.2/Vivado/bin/vivado"
          chmod +x "$tools/Vivado/2023.2/bin/vivado" "$tools/2025.2/Vivado/bin/vivado"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          export FPGA_BRIDGE_VIVADO_ROOTS="$tools"
          out="$(linux/setup.sh --public-key 'ssh-ed25519 AAAAKey ci@runner')"
          echo "$out"
          echo "$out" | grep -q "fpga-bridge init --host .* --user $USER --vivado \"$tools/2025.2/Vivado/bin/vivado\" --os linux"
          echo "$out" | grep -q "it starts: vivado v2025.2"
          grep -q AAAAKey "$HOME/.ssh/authorized_keys"
          [ "$(stat -c %a "$HOME/.ssh/authorized_keys")" = "600" ]
          [ "$(stat -c %a "$HOME/.ssh")" = "700" ]
          # Newest first, by version number.
          [ "$(bash -c 'source linux/setup.sh; find_vivado' | head -n1)" = "$tools/2025.2/Vivado/bin/vivado" ]
